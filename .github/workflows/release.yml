name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download UPX
        run: |
          $ver = "5.2.1"
          $zipName = "upx-$ver-win64.zip"
          $url = "https://github.com/upx/upx/releases/download/v$ver/$zipName"
          $expected = "eabc6792a347d45e945be7748423e7868fd01b0d2bcaa2f4b1031fd71ff69bda"
          $work = Join-Path $env:RUNNER_TEMP "upx"
          New-Item -Path $work -ItemType Directory -Force | Out-Null
          $zipPath = Join-Path $work $zipName
          curl.exe -sS -L --fail --retry 3 -o $zipPath $url
          if ($LASTEXITCODE -ne 0) { Write-Host "[ERROR] UPX download failed"; exit 1 }
          $actual = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Host "[ERROR] SHA256 mismatch: expected $expected got $actual"
            exit 1
          }
          Write-Host "[INFO] SHA256 verified"
          Expand-Archive -Path $zipPath -DestinationPath $work -Force
          $upxExe = Join-Path $work "upx-$ver-win64\upx.exe"
          if (-not (Test-Path -LiteralPath $upxExe)) {
            Write-Host "[ERROR] upx.exe not found at $upxExe"
            exit 1
          }
          & $upxExe --version
          "UPX_EXE=$upxExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build with Nuitka
        run: nuitka --onefile --standalone --windows-console-mode=attach --assume-yes-for-downloads src/main.py --enable-plugins=upx --upx-binary="$env:UPX_EXE" --onefile-no-compression --output-filename="lgpunch.exe" --output-dir="dist"
        env:
          NUITKA_ASSUME_YES_FOR_DOWNLOADS: "1"

      - name: Prepare release package
        run: |
          New-Item -Path "release" -ItemType Directory -Force | Out-Null
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Host "[ERROR] No .exe found in dist/"
            exit 1
          }
          Write-Host "[INFO] Found: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination "release\lgpunch.exe" -Force
          Copy-Item -Path "scripts\setup.ps1" -Destination "release\setup.ps1" -Force
          Get-ChildItem -Path "release" | ForEach-Object { Write-Host "  - $($_.Name) ($($_.Length) bytes)" }

      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create zip archive
        run: Compress-Archive -Path "release\*" -DestinationPath "lgpunch-${{ steps.version.outputs.tag }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## LuoguDailyPunch ${{ steps.version.outputs.tag }}

            ### 下载
            解压 `lgpunch-${{ steps.version.outputs.tag }}.zip`，运行 `setup.ps1` 完成安装。

            ### 快速开始
            ```powershell
            .\setup.ps1
            ```
          files: lgpunch-${{ steps.version.outputs.tag }}.zip
          draft: false
          prerelease: false
